<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Photobooth d'Auré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110f;
    --ink: #fbf6ee;
    --muted: rgba(251, 246, 238, .62);
    --accent: #f2b33d;
    --paper: #fffdf8;
    --line: rgba(251, 246, 238, .18);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--serif); -webkit-tap-highlight-color: transparent; }
  main { width: min(520px, 100%); margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  .ecran { display: none; flex-direction: column; gap: 16px; min-height: calc(100svh - 36px); }
  .ecran.on { display: flex; }

  h1 { font-weight: 800; font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: .95; letter-spacing: -.03em; color: var(--accent); }
  h2 { font-weight: 800; font-size: 1.5rem; }
  .main { font-family: var(--hand); font-size: 1.5rem; color: var(--muted); }
  p { line-height: 1.4; }
  .etapes { list-style: none; padding: 0; display: grid; gap: 10px; }
  .etapes li { display: flex; gap: 12px; align-items: center; font-size: 1.05rem; }
  .etapes b { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--bg);
              display: grid; place-items: center; font-weight: 800; }
  .accueil-visage { width: 62%; max-width: 260px; aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--paper);
                    align-self: center; object-fit: cover; box-shadow: 0 16px 40px rgba(0,0,0,.6); margin: 8px 0; }

  .bouton { font: inherit; font-weight: 800; font-size: 1.15rem; border: 0; border-radius: 999px; padding: 16px 22px;
            background: var(--accent); color: var(--bg); cursor: pointer; width: 100%; text-align: center; text-decoration: none; display: block; }
  .bouton.second { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  .bouton:disabled { opacity: .5; }
  .rangee { display: flex; gap: 10px; }
  .rangee > * { flex: 1; }
  .pousse { margin-top: auto; display: grid; gap: 10px; }

  .camera { position: relative; width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #000; }
  .camera video, .camera img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .camera video { transform: scaleX(-1); }
  .camera .info { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
  .compte { position: absolute; inset: 0; display: grid; place-items: center; font-size: 9rem; font-weight: 800;
            color: var(--paper); text-shadow: 0 6px 30px rgba(0,0,0,.6); pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .declencheur { width: 84px; height: 84px; border-radius: 50%; border: 6px solid var(--paper); background: var(--accent);
                 align-self: center; cursor: pointer; box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent); }
  .declencheur:disabled { opacity: .4; }
  .lien { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; align-self: center; padding: 6px; }

  .apercu { width: 100%; height: auto; border-radius: 10px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .reglage { display: grid; gap: 8px; }
  .reglage label, .titre-reglage { display: flex; justify-content: space-between; align-items: baseline; font-size: 1rem; color: var(--muted); }
  .reglage output { font-family: var(--hand); font-size: 1.8rem; color: var(--accent); line-height: 1; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
  .styles { display: flex; flex-wrap: wrap; gap: 8px; }
  .styles button { font: inherit; font-size: .98rem; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
                   background: transparent; color: var(--ink); cursor: pointer; }
  .styles button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 800; }
  input[type=text] { font: inherit; font-size: 1.05rem; width: 100%; padding: 12px 14px; border-radius: 12px;
                     border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); }
  .resultat { width: 100%; border-radius: 10px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.5);
              -webkit-touch-callout: default; }
  .astuce { font-size: .92rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <!-- 1. Accueil -->
  <section class="ecran on" id="accueil">
    <div class="main">24 octobre 2026</div>
    <h1>Le photobooth des 40 ans d'Auré</h1>
    <img class="accueil-visage" src="morphing/a400.jpg" alt="Auré">
    <ol class="etapes">
      <li><b>1</b> Prends-toi en selfie</li>
      <li><b>2</b> Choisis ton Auré : son âge et son style</li>
      <li><b>3</b> Partage ta photo souvenir</li>
    </ol>
    <div class="pousse"><button class="bouton" id="commencer">C'est parti !</button></div>
  </section>

  <!-- 2. Selfie -->
  <section class="ecran" id="selfie">
    <h2>Ton plus beau sourire</h2>
    <div class="camera">
      <video playsinline muted autoplay></video>
      <img alt="" hidden>
      <div class="info" hidden></div>
      <div class="compte"></div>
      <div class="flash"></div>
    </div>
    <div id="prise">
      <div class="pousse" style="gap:14px">
        <button class="declencheur" id="declencher" aria-label="Prendre la photo"></button>
        <button class="lien" id="importer">ou choisir une photo existante</button>
      </div>
    </div>
    <div id="validation" hidden class="pousse">
      <div class="rangee">
        <button class="bouton second" id="refaire">Recommencer</button>
        <button class="bouton" id="valider">Super, suivant</button>
      </div>
    </div>
    <input type="file" accept="image/*" capture="user" id="fichier" hidden>
  </section>

  <!-- 3. Configurer Auré -->
  <section class="ecran" id="config">
    <canvas class="apercu" width="1080" height="1350"></canvas>
    <div class="reglage">
      <label for="age">Âge d'Auré <output id="ageTxt"></output></label>
      <input type="range" id="age" min="0" max="70" step="0.2" value="40">
    </div>
    <div class="reglage">
      <div class="titre-reglage">Style</div>
      <div class="styles" id="styles"></div>
    </div>
    <div class="reglage">
      <label for="prenom">Ton prénom (facultatif)</label>
      <input type="text" id="prenom" maxlength="24" autocomplete="given-name" placeholder="ex. Claire">
    </div>
    <div class="pousse">
      <button class="bouton" id="creer">Créer mon image</button>
      <button class="lien" id="autreSelfie">Reprendre le selfie</button>
    </div>
  </section>

  <!-- 4. Résultat -->
  <section class="ecran" id="resultat">
    <img class="resultat" alt="Ta photo avec Auré">
    <div class="pousse">
      <button class="bouton" id="partager">Partager</button>
      <a class="bouton second" id="telecharger" download="40-ans-aure.jpg">Enregistrer l'image</a>
      <p class="astuce">Si rien ne se passe : appui long sur l'image, puis « Enregistrer » ou « Partager ».</p>
      <div class="rangee">
        <button class="bouton second" id="retoucher">Modifier Auré</button>
        <button class="bouton second" id="encore">Nouvelle photo</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const ecrans = [...document.querySelectorAll(".ecran")];
function aller(id) { ecrans.forEach(e => e.classList.toggle("on", e.id === id)); scrollTo(0, 0); }

// ---------- Visages d'Auré : morphing/aXXX.jpg, XXX = âge × 10 (pas de 0,2 an) ----------
const visages = [];
function visage(k) {
  if (!visages[k]) { const im = new Image(); im.src = "morphing/a" + String(k * 2).padStart(3, "0") + ".jpg"; im.onload = rafraichir; visages[k] = im; }
  return visages[k];
}
function visagePret(age) {
  const k = Math.round(age * 5), im = visage(k);
  if (im.complete && im.naturalWidth) return im;
  for (let d = 1; d <= 350; d++)
    for (const j of [k - d, k + d]) { const v = visages[j]; if (v && v.complete && v.naturalWidth) return v; }
  return null;
}
for (let a = 0; a <= 70; a++) visage(a * 5);   // un visage par an pour démarrer

// Tête détourée (ellipse aux bords adoucis), mise en cache par image
const tetes = new Map();
function tete(im) {
  if (tetes.has(im)) return tetes.get(im);
  const c = document.createElement("canvas"); c.width = c.height = 360;
  const x = c.getContext("2d");
  x.drawImage(im, 0, 0, 360, 360);
  x.globalCompositeOperation = "destination-in";
  x.translate(178, 172); x.scale(1, 1.27);
  const g = x.createRadialGradient(0, 0, 96, 0, 0, 118);
  g.addColorStop(0, "#000"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, 118, 0, 7); x.fill();
  tetes.set(im, c);
  return c;
}

// ---------- Dessin du personnage (repère 600 × 880, cou en (300, 372)) ----------
const T = "#2b1d14", PEAU = "#f0c4a0";
function forme(c, couleur, trace, epais = 6) {
  c.beginPath(); trace(); c.fillStyle = couleur; c.fill();
  c.lineWidth = epais; c.strokeStyle = T; c.lineJoin = "round"; c.stroke();
}
function rect(c, x, y, w, h, r) {
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ovale(c, x, y, rx, ry, rot = 0) { c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }

function cheminTorse(c, ventre) {
  c.moveTo(220, 372); c.lineTo(380, 372);
  c.quadraticCurveTo(428, 376, 432, 418);
  c.quadraticCurveTo(425 + ventre * 1.8, 520, 408, 612);
  c.quadraticCurveTo(404, 628, 384, 628); c.lineTo(216, 628);
  c.quadraticCurveTo(196, 628, 192, 612);
  c.quadraticCurveTo(175 - ventre * 1.8, 520, 168, 418);
  c.quadraticCurveTo(172, 376, 220, 372); c.closePath();
}
function torse(c, couleur, ventre = 0, motif) {
  c.save(); c.beginPath(); cheminTorse(c, ventre); c.fillStyle = couleur; c.fill();
  if (motif) { c.clip(); motif(); }
  c.restore();
  c.beginPath(); cheminTorse(c, ventre); c.lineWidth = 6; c.strokeStyle = T; c.stroke();
}
function jambes(c, o) {
  // o : { pantalon, court, chaussette, chaussure, rayures }
  for (const x of [228, 308]) {
    forme(c, o.court ? PEAU : o.pantalon, () => rect(c, x, 600, 64, 222, 14));
    if (o.chaussette) {
      forme(c, o.chaussette, () => rect(c, x, 730, 64, 92, 10));
      if (o.rayures) { c.fillStyle = o.rayures; c.fillRect(x + 3, 748, 58, 14); c.fillRect(x + 3, 776, 58, 14); }
    }
    if (o.court) forme(c, o.pantalon, () => rect(c, x - 6, 596, 76, 98, 12));
  }
  forme(c, o.chaussure, () => ovale(c, 250, 828, 50, 22));
  forme(c, o.chaussure, () => ovale(c, 350, 828, 50, 22));
}
function main_(c, x, y) { forme(c, PEAU, () => ovale(c, x, y, 23, 23)); }
function bras(c, epaule, coude, poing, manche, court = false) {
  const trait = (w, col, pts) => {
    c.beginPath(); c.moveTo(...pts[0]); for (const p of pts.slice(1)) c.lineTo(...p);
    c.lineWidth = w; c.strokeStyle = col; c.lineCap = "round"; c.lineJoin = "round"; c.stroke();
  };
  const tout = [epaule, coude, poing];
  trait(50, T, tout);
  trait(38, PEAU, tout);
  const fin = court ? [(epaule[0] + coude[0]) / 2, (epaule[1] + coude[1]) / 2] : poing;
  trait(38, manche, court ? [epaule, fin] : [epaule, coude, [poing[0] - (poing[0] - coude[0]) * .18, poing[1] - (poing[1] - coude[1]) * .18]]);
  main_(c, ...poing);
}
function col(c, couleur) { forme(c, couleur, () => { c.moveTo(262, 368); c.lineTo(300, 410); c.lineTo(338, 368); c.lineTo(322, 362); c.lineTo(300, 388); c.lineTo(278, 362); c.closePath(); }, 4); }
function etoile(c, x, y, r, couleur) {
  c.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, d = k % 2 ? r * .32 : r; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
  c.closePath(); c.fillStyle = couleur; c.fill();
}
function confettisAutour(c, n, graine, yMax = 1e9) {
  const couleurs = ["#f2b33d", "#e85d4a", "#4aa3e8", "#7bd389", "#fbf6ee"];
  let s = graine; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let k = 0; k < n; k++) {
    const x = r() * 600, y = r() * 760, a = r() * 6;
    if (y > yMax) continue;
    c.save(); c.translate(x, y); c.rotate(a);
    c.fillStyle = couleurs[k % couleurs.length]; c.fillRect(-7, -11, 14, 22); c.restore();
  }
}

const STYLES = {
  rugby: {
    nom: "🏉 Rugby", bulle: "Passe-la au 9 !",
    corps(c) {
      jambes(c, { pantalon: "#fbf6ee", court: true, chaussette: "#c8102e", rayures: "#1d1d1d", chaussure: "#1d1d1d" });
      torse(c, "#c8102e", 0, () => { c.fillStyle = "#1d1d1d"; for (let y = 400; y < 640; y += 64) c.fillRect(150, y, 300, 32); });
      col(c, "#fbf6ee");
      c.font = "800 92px Fraunces, Georgia, serif"; c.textAlign = "center"; c.lineWidth = 10; c.strokeStyle = T;
      c.strokeText("9", 300, 545); c.fillStyle = "#fbf6ee"; c.fillText("9", 300, 545);
      c.fillStyle = "rgba(110,70,35,.55)";
      for (const [x, y, r] of [[240, 650, 16], [262, 668, 9], [350, 630, 12], [205, 470, 10], [380, 760, 14]]) { c.beginPath(); ovale(c, x, y, r, r * .8); c.fill(); }
      bras(c, [192, 405], [160, 500], [190, 592], "#c8102e", true);
      bras(c, [408, 405], [462, 478], [398, 522], "#c8102e", true);
      forme(c, "#8b4a2b", () => ovale(c, 440, 500, 66, 40, -.45));
      c.strokeStyle = "#fbf6ee"; c.lineWidth = 4; c.beginPath(); c.moveTo(410, 510); c.lineTo(468, 482); c.stroke();
      for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(421 + k * 14, 497 - k * 6); c.lineTo(427 + k * 14, 510 - k * 6); c.stroke(); }
      main_(c, 398, 522);
    },
  },
  badminton: {
    nom: "🏸 Badminton", bulle: "Il était dedans, ce volant !",
    corps(c) {
      jambes(c, { pantalon: "#1f3a68", court: true, chaussette: "#fbf6ee", chaussure: "#fbf6ee" });
      torse(c, "#fbf6ee", 0, () => { c.fillStyle = "#2f7fd8"; c.beginPath(); c.moveTo(150, 520); c.lineTo(450, 440); c.lineTo(450, 480); c.lineTo(150, 560); c.fill(); });
      col(c, "#2f7fd8");
      bras(c, [192, 405], [160, 500], [185, 590], "#fbf6ee", true);
      bras(c, [408, 405], [478, 352], [462, 262], "#fbf6ee", true);
      c.lineCap = "round"; c.strokeStyle = T; c.lineWidth = 16; c.beginPath(); c.moveTo(462, 290); c.lineTo(492, 132); c.stroke();
      c.strokeStyle = "#c8102e"; c.lineWidth = 9; c.stroke();
      c.save(); c.translate(510, 62); c.rotate(.18);
      c.beginPath(); ovale(c, 0, 0, 50, 68); c.save(); c.clip();
      c.strokeStyle = "rgba(43,29,20,.55)"; c.lineWidth = 2;
      for (let k = -60; k <= 60; k += 12) { c.beginPath(); c.moveTo(k, -70); c.lineTo(k, 70); c.moveTo(-70, k); c.lineTo(70, k); c.stroke(); }
      c.restore(); c.beginPath(); ovale(c, 0, 0, 50, 68); c.lineWidth = 9; c.strokeStyle = "#e8e8e8"; c.stroke(); c.lineWidth = 2; c.strokeStyle = T; c.stroke(); c.restore();
      main_(c, 462, 262);
      c.save(); c.translate(120, 150); c.rotate(-.6);
      forme(c, "#fbf6ee", () => { c.moveTo(-14, 0); c.lineTo(-30, -62); c.lineTo(30, -62); c.lineTo(14, 0); c.closePath(); }, 4);
      forme(c, "#f2b33d", () => ovale(c, 0, 8, 16, 14), 4);
      c.restore();
    },
    tete(c) {
      forme(c, "#c8102e", () => { c.moveTo(188, 128); c.quadraticCurveTo(300, 100, 412, 128); c.lineTo(414, 160); c.quadraticCurveTo(300, 132, 186, 160); c.closePath(); }, 5);
    },
  },
  daron: {
    nom: "🧺 Daron", bulle: "Bon, on y va au marché ?",
    corps(c) {
      jambes(c, { pantalon: "#d9c39a", court: true, chaussette: "#fbf6ee", chaussure: "#7a4b2a" });
      torse(c, "#2f7d5b", 34);
      forme(c, "#5a3a22", () => rect(c, 186, 596, 228, 22, 6), 4);
      forme(c, "#c9a227", () => rect(c, 286, 595, 28, 24, 4), 3);
      col(c, "#2f7d5b");
      c.fillStyle = T; for (const y of [425, 450]) { c.beginPath(); ovale(c, 300, y, 5, 5); c.fill(); }
      bras(c, [408, 405], [470, 495], [440, 580], "#2f7d5b", true);
      bras(c, [192, 405], [138, 490], [150, 568], "#2f7d5b", true);
      // panier du marché
      c.lineWidth = 8; c.strokeStyle = T; c.beginPath(); c.moveTo(100, 620); c.quadraticCurveTo(150, 520, 205, 620); c.stroke();
      c.save(); c.translate(100, 560); c.rotate(-.35);
      forme(c, "#f4d58d", () => rect(c, 0, -10, 26, 130, 13), 5);
      c.restore();
      forme(c, "#5aa64a", () => { c.moveTo(190, 610); c.lineTo(230, 520); c.lineTo(212, 612); c.closePath(); }, 4);
      forme(c, "#c8955a", () => { c.moveTo(78, 612); c.lineTo(228, 612); c.lineTo(212, 700); c.lineTo(94, 700); c.closePath(); });
      c.strokeStyle = "rgba(43,29,20,.45)"; c.lineWidth = 3;
      for (let x = 90; x < 230; x += 18) { c.beginPath(); c.moveTo(x, 614); c.lineTo(x + 8, 698); c.stroke(); }
      for (let y = 636; y < 700; y += 22) { c.beginPath(); c.moveTo(84, y); c.lineTo(222, y); c.stroke(); }
      main_(c, 150, 568);
    },
    tete(c) {
      c.save(); c.translate(300, 112); c.rotate(-.05);
      c.lineWidth = 6; c.strokeStyle = T; c.beginPath(); c.moveTo(-34, 0); c.lineTo(34, 0); c.stroke();
      for (const x of [-62, 62]) forme(c, "#1d1d1d", () => ovale(c, x, 4, 38, 26), 5);
      c.fillStyle = "rgba(255,255,255,.35)"; for (const x of [-72, 52]) { c.beginPath(); ovale(c, x, -4, 10, 6, -.4); c.fill(); }
      c.restore();
    },
  },
  soiree: {
    nom: "🥂 Soirée", bulle: "Tournée générale !",
    corps(c) {
      confettisAutour(c, 26, 7);
      jambes(c, { pantalon: "#1d1d1d", chaussure: "#0d0d0d" });
      torse(c, "#6b1f3a", 0, () => {
        c.fillStyle = "#fbf6ee"; c.beginPath(); c.moveTo(254, 360); c.lineTo(346, 360); c.lineTo(300, 540); c.closePath(); c.fill();
      });
      forme(c, "#f2b33d", () => { c.moveTo(300, 396); c.lineTo(262, 376); c.lineTo(262, 416); c.closePath(); c.moveTo(300, 396); c.lineTo(338, 376); c.lineTo(338, 416); c.closePath(); }, 4);
      forme(c, "#f2b33d", () => ovale(c, 300, 396, 10, 10), 4);
      // ballon « 40 » à droite, coupe de champagne à gauche
      bras(c, [408, 405], [480, 400], [462, 312], "#6b1f3a");
      c.strokeStyle = T; c.lineWidth = 3; c.beginPath(); c.moveTo(462, 312); c.quadraticCurveTo(500, 260, 535, 245); c.stroke();
      c.font = "800 120px Fraunces, Georgia, serif"; c.textAlign = "center"; c.lineJoin = "round";
      c.lineWidth = 12; c.strokeStyle = T; c.strokeText("40", 535, 245); c.fillStyle = "#f2b33d"; c.fillText("40", 535, 245);
      main_(c, 462, 312);
      bras(c, [192, 405], [140, 500], [175, 545], "#6b1f3a");
      c.lineWidth = 5; c.strokeStyle = T; c.beginPath(); c.moveTo(175, 560); c.lineTo(175, 480); c.stroke();

// ---------- Composition finale 1080 × 1350 ----------
let selfie = null, styleChoisi = "rugby";
function echelleCorps(age) { return age < 16 ? .6 + .4 * age / 16 : 1; }

function dessinerPerso(c, age, style) {
  const s = STYLES[style], b = echelleCorps(age);
  c.save(); c.translate(300, 372); c.scale(b, b); c.translate(-300, -372);
  forme(c, PEAU, () => rect(c, 276, 330, 48, 56, 12), 5);
  s.corps(c);
  c.restore();
  const im = visagePret(age);
  if (im) {
    c.save(); c.shadowColor = "rgba(0,0,0,.35)"; c.shadowBlur = 18; c.shadowOffsetY = 6;
    c.drawImage(tete(im), 122, 48); c.restore();
  }
  if (s.tete) s.tete(c);
  return 372 + (840 - 372) * b;   // ordonnée des pieds
}

function bulle(c, x, y, w, texte, pointe) {
  c.font = "700 46px Caveat, cursive";
  const mots = texte.split(" "), lignes = [""];
  for (const m of mots) { const l = (lignes.at(-1) + " " + m).trim(); if (c.measureText(l).width > w - 50 && lignes.at(-1)) lignes.push(m); else lignes[lignes.length - 1] = l; }
  const h = 30 + lignes.length * 48;
  forme(c, "#fffdf8", () => { rect(c, x, y, w, h, 28); }, 5);
  forme(c, "#fffdf8", () => { c.moveTo(pointe[0] - 26, y + h - 3); c.lineTo(...pointe); c.lineTo(pointe[0] + 14, y + h - 3); }, 5);
  c.fillStyle = "#fffdf8"; c.fillRect(pointe[0] - 23, y + h - 9, 34, 8);
  c.fillStyle = T; c.textAlign = "center"; c.textBaseline = "middle";
  lignes.forEach((l, k) => c.fillText(l, x + w / 2, y + 40 + k * 48));
  c.textBaseline = "alphabetic";
}

function composer(cv) {
  const c = cv.getContext("2d"), W = 1080, H = 1350;
  const age = +$("#age").value, st = STYLES[styleChoisi];
  const fond = c.createRadialGradient(540, 520, 80, 540, 600, 900);
  fond.addColorStop(0, "#3a2c20"); fond.addColorStop(1, "#14110f");
  c.fillStyle = fond; c.fillRect(0, 0, W, H);
  c.save(); c.globalAlpha = .55; c.scale(1.8, 1.8); confettisAutour(c, 40, 3, 1130 / 1.8); c.restore();

  // Polaroïd du selfie
  c.save(); c.translate(60, 70); c.rotate(-.05);
  c.shadowColor = "rgba(0,0,0,.55)"; c.shadowBlur = 40; c.shadowOffsetY = 18;
  c.fillStyle = "#fffdf8"; c.fillRect(0, 0, 640, 760); c.shadowColor = "transparent";
  if (selfie) c.drawImage(selfie, 30, 30, 580, 580); else { c.fillStyle = "#ccc"; c.fillRect(30, 30, 580, 580); }
  const prenom = $("#prenom").value.trim();
  c.fillStyle = T; c.font = "700 56px Caveat, cursive"; c.textAlign = "center";
  c.fillText(prenom ? prenom + " & Auré" : "Avec Auré", 320, 686);
  c.restore();

  // Auré
  const ech = .95, ox = 480, oy = 330;
  c.save(); c.translate(ox, oy); c.scale(ech, ech);
  const pieds = dessinerPerso(c, age, styleChoisi);
  c.restore();
  c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); ovale(c, ox + 300 * ech, oy + (pieds + 8) * ech, 130 * ech, 20 * ech); c.fill();
  // l'ombre passe sous les pieds : on redessine le perso par-dessus
  c.save(); c.translate(ox, oy); c.scale(ech, ech); dessinerPerso(c, age, styleChoisi); c.restore();

  bulle(c, 680, 110, 370, st.bulle, [ox + 250 * ech, oy + 40 * ech]);

  // Légende
  c.textAlign = "center";
  c.font = "800 88px Fraunces, Georgia, serif"; c.fillStyle = "#f2b33d";
  c.fillText("Les 40 ans d'Auré", W / 2, 1238);
  c.font = "700 58px Caveat, cursive"; c.fillStyle = "#fbf6ee";
  const a = Math.round(age), quand = age < 1 ? "Auré bébé" : `Auré à ${a} an${a > 1 ? "s" : ""}`;
  c.fillText(`24 octobre 2026  ·  ${quand}`, W / 2, 1310);
}

// ---------- Écran Configurer ----------
const apercu = $(".apercu");
let enAttente = false;
function rafraichir() {
  if (enAttente || !$("#config").classList.contains("on")) return;
  enAttente = true;
  requestAnimationFrame(() => { enAttente = false; composer(apercu); });
}
function majAge() {
  const age = +$("#age").value, a = Math.floor(age);
  $("#ageTxt").textContent = age < 1 ? "bébé" : a + " an" + (a > 1 ? "s" : "");
  rafraichir();
}
$("#age").addEventListener("input", majAge);
$("#prenom").addEventListener("input", rafraichir);
for (const [cle, s] of Object.entries(STYLES)) {
  const b = document.createElement("button");
  b.textContent = s.nom; b.setAttribute("aria-pressed", cle === styleChoisi);
  b.onclick = () => {
    styleChoisi = cle;
    document.querySelectorAll("#styles button").forEach(x => x.setAttribute("aria-pressed", x === b));
    rafraichir();
  };
  $("#styles").appendChild(b);
}
// Le style et l'âge de départ sont tirés au hasard, pour varier les photos
{
  const cles = Object.keys(STYLES), k = Math.floor(Math.random() * cles.length);
  document.querySelectorAll("#styles button")[k].click();
}
function ouvrirConfig() { aller("config"); majAge(); }

// ---------- Selfie ----------
const video = $("#selfie video"), figee = $("#selfie img"), info = $("#selfie .info");
let flux = null;
async function demarrerCamera() {
  figee.hidden = true; video.hidden = false; info.hidden = true;
  $("#prise").hidden = false; $("#validation").hidden = true;
  if (flux) return;
  try {
    flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    video.srcObject = flux; await video.play();
    $("#declencher").disabled = false;
  } catch (e) {
    video.hidden = true; info.hidden = false; $("#declencher").disabled = false;
    info.textContent = "La caméra n'est pas accessible ici. Appuie sur le bouton pour ouvrir l'appareil photo.";
  }
}
function arreterCamera() { if (flux) { flux.getTracks().forEach(t => t.stop()); flux = null; } }

function figer(source, w, h, miroir) {
  const cote = Math.min(w, h), cv = document.createElement("canvas");
  cv.width = cv.height = 1080;
  const c = cv.getContext("2d");
  if (miroir) { c.translate(1080, 0); c.scale(-1, 1); }
  c.drawImage(source, (w - cote) / 2, (h - cote) / 2, cote, cote, 0, 0, 1080, 1080);
  selfie = cv;
  figee.src = cv.toDataURL("image/jpeg", .85); figee.hidden = false; video.hidden = true; info.hidden = true;
  $("#prise").hidden = true; $("#validation").hidden = false;
}
$("#declencher").onclick = () => {
  if (!flux || !video.videoWidth) return $("#fichier").click();
  $("#declencher").disabled = true;
  const compte = $(".compte");
  let n = 3; compte.textContent = n;
  const t = setInterval(() => {
    n--;
    if (n > 0) return compte.textContent = n;
    clearInterval(t); compte.textContent = "";
    const f = $(".flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    figer(video, video.videoWidth, video.videoHeight, true);
    $("#declencher").disabled = false;
  }, 800);
};
$("#importer").onclick = () => $("#fichier").click();
$("#fichier").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => { figer(im, im.naturalWidth, im.naturalHeight, false); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f);
  e.target.value = "";
};
$("#refaire").onclick = demarrerCamera;
$("#valider").onclick = () => { arreterCamera(); ouvrirConfig(); };
$("#commencer").onclick = () => { aller("selfie"); demarrerCamera(); };
$("#autreSelfie").onclick = () => { aller("selfie"); demarrerCamera(); };

// ---------- Résultat et partage ----------
let fichier = null;
$("#creer").onclick = async () => {
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1350;
  composer(cv);
  let blob;
  try { blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .9)); }
  catch (e) {
    // Page ouverte depuis le disque (file://) : le navigateur interdit l'export du canvas
    return alert(location.protocol === "file:"
      ? "Impossible de créer l'image quand la page est ouverte directement depuis le disque. Ouvre-la via un serveur (voir LISEZMOI.md) ou depuis son adresse en ligne."
      : "Impossible de créer l'image : " + e.message);
  }
  fichier = new File([blob], "40-ans-aure.jpg", { type: "image/jpeg" });
  const url = URL.createObjectURL(blob);
  $(".resultat").src = url; $("#telecharger").href = url;
  $("#partager").hidden = !(navigator.canShare && navigator.canShare({ files: [fichier] }));
  aller("resultat");
};
$("#partager").onclick = async () => {
  try { await navigator.share({ files: [fichier], title: "Les 40 ans d'Auré", text: "Les 40 ans d'Auré · 24 octobre 2026 🎉" }); }
  catch (e) { /* partage annulé */ }
};
$("#retoucher").onclick = ouvrirConfig;
$("#encore").onclick = () => { selfie = null; aller("selfie"); demarrerCamera(); };

// Les polices doivent être chargées avant de dessiner dans le canvas
Promise.all(["800 40px Fraunces", "700 40px Caveat"].map(f => document.fonts.load(f))).then(rafraichir, rafraichir);
